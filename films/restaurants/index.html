  ["#rc-c1", "#rc-c2", "#rc-c3"].forEach((s, i) => tl.fromTo(s, { opacity: 0, y: 120 }, { opacity: 1, y: 0, duration: 0.6, ease: "expo.out" }, C + 0.2 + i * 0.1));
  tl.fromTo("#rc-k2", { opacity: 0 }, { opacity: 1, duration: 0.3 }, C + 0.5);
  ["#rc-k1", "#rc-k3", "#rc-k4"].forEach((s, i) => tl.fromTo(s, { opacity: 0, y: -60, scale: 0.9 }, { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: "back.out(1.5)" }, C + 1.1 + i * 0.22));
  clock("rc-tm1", 0, 252, C + 1.2, 3.4); clock("rc-tm3", 0, 248, C + 1.4, 3.3); clock("rc-tm4", 0, 95, C + 1.6, 1.5);
  tl.fromTo("#rc-ready", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(1.8)" }, C + 3.2);
  tl.fromTo("#rc-k4", { boxShadow: "0 0 0 0 rgba(25,227,107,0)" }, { boxShadow: "0 0 0 6px rgba(25,227,107,.9)", duration: 0.3, immediateRender: false }, C + 3.2);
  tl.to(["#rc-c1", "#rc-c2", "#rc-c3", "#rc-copy"], { opacity: 0, filter: "blur(12px)", y: -40, duration: 0.35, ease: "power3.in" }, C + 4.6);

  // D
  const D = 15.8;
  tl.fromTo("#rd-phone", { opacity: 0, y: 900, rotation: -8 }, { opacity: 1, y: 0, rotation: 0, duration: 0.8, ease: "expo.out" }, D + 0.05);
  tl.fromTo("#rd-copy .eyebrow", { opacity: 0 }, { opacity: 1, duration: 0.3 }, D + 0.3);
  wordsIn(dW, D + 0.35);
  tl.fromTo("#rd-sub", { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.3 }, D + 1.1);
  tl.fromTo("#rd-msg", { opacity: 0, scale: 0.85, y: 20 }, { opacity: 1, scale: 1, y: 0, duration: 0.45, ease: "back.out(1.5)" }, D + 1.0);
  ["#rd-l1", "#rd-l2", "#rd-l3", "#rd-l4"].forEach((s, i) => tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.25 }, D + 1.3 + i * 0.25));
  const sales = { v: 0 };
  tl.fromTo(sales, { v: 0 }, { v: 8450, duration: 1.4, ease: "power3.out", onUpdate: () => { document.getElementById("rd-sales").textContent = "Bs " + Math.round(sales.v).toLocaleString("es-BO"); } }, D + 1.3);
  tl.fromTo("#rd-demo", { opacity: 0 }, { opacity: 1, duration: 0.3 }, D + 2.2);
  tl.to("#rd-copy", { opacity: 0, filter: "blur(8px)", duration: 0.2 }, D + 4.4);

  // E · flood from the phone
  const E = 20.6;
  tl.fromTo("#re-flood", { scale: 30 }, { scale: 460, duration: 0.55, ease: "power2.inOut" }, E);
  tl.fromTo("#re-eye", { opacity: 0 }, { opacity: 1, duration: 0.3 }, E + 0.45);
  tl.fromTo(eW, { opacity: 0.12 }, { opacity: 1, duration: 0.12, stagger: 0.09 }, E + 0.55);
  tl.fromTo("#re-cta", { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.5, ease: "expo.out" }, E + 1.2);
  tl.fromTo("#re-brand", { opacity: 0 }, { opacity: 0.75, duration: 0.4 }, E + 1.5);

  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = tl;
  tl.seek(0);
</script>
